<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MerLuy Preview</title>
<style>
:root{--bg:#06164b;--panel:#102d73cc;--panel2:#174899cc;--blue:#176eff;--cyan:#62f5ff;--muted:#9db7df;--green:#4ade80;--red:#f87171}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020817;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.phone{width:min(390px,100%);min-height:780px;border:8px solid #202b49;border-radius:42px;overflow:hidden;position:relative;background:radial-gradient(circle at 0 0,#1267e85e,transparent 38%),radial-gradient(circle at 100% 100%,#13d9e345,transparent 40%),var(--bg);box-shadow:0 25px 80px #0009}.status{height:30px;padding:8px 19px;font-size:11px;font-weight:700;display:flex;justify-content:space-between}.screen{padding:16px 18px 108px;min-height:710px;overflow:auto}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px}.logo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));font-size:18px}.top{display:flex;justify-content:space-between;align-items:center}.icon{width:48px;height:48px;border:1px solid #ffffff2b;border-radius:50%;background:#ffffff12;color:white;font-size:20px;position:relative}.badge{position:absolute;right:-2px;top:-3px;background:var(--red);font-size:9px;padding:4px 6px;border-radius:20px}.h1{font-size:28px;font-weight:850;margin:25px 0 4px}.sub{color:var(--muted);font-size:13px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:22px 0 9px}.card{background:linear-gradient(135deg,#3985df36,#102255b8);border:1px solid #ffffff1a;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 10px 25px #0003}.market{display:flex;justify-content:space-between;align-items:center}.pair{font-weight:700}.rate{font-size:23px;font-family:ui-monospace,monospace;font-weight:800;margin-top:9px}.change{font-size:11px;color:var(--green);background:#4ade8020;border-radius:20px;padding:6px 8px}.nav{position:absolute;bottom:14px;left:14px;right:14px;display:flex;gap:4px;padding:7px;background:#17191ccc;border:1px solid #ffffff25;border-radius:30px;backdrop-filter:blur(22px);box-shadow:0 10px 30px #0008}.nav button{flex:1;min-height:62px;border:0;border-radius:22px;background:transparent;color:#9db7df;font-size:10px}.nav button.active{background:#ffffff1b;color:var(--cyan)}.nav b{display:block;font-size:22px;margin-bottom:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.input,select{width:100%;border:1px solid #ffffff1d;background:#ffffff0d;color:white;border-radius:14px;padding:15px;font-size:15px;margin:6px 0 10px}button.primary{width:100%;min-height:50px;background:var(--blue);border:0;border-radius:15px;color:white;font-weight:800;margin-top:10px}.pill{background:#ffffff18;border-radius:20px;padding:9px 12px;font-size:12px}.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));font-size:38px;margin:auto}.center{text-align:center}.stat{flex:1}.plan{color:#ffe36e;font-weight:800}.toast{color:var(--green);font-size:12px;margin:10px 0}.hidden{display:none}.back{background:none;border:0;color:var(--cyan);font-size:14px;padding:8px 0}
</style></head>
<body><main class="phone"><div class="status"><span>9:41</span><span>● ● ▰</span></div><section id="screen" class="screen"></section><nav class="nav" id="nav"></nav></main>
<script>
const state={tab:'home',logged:false,name:'MerLuy User',email:'',pro:false,notes:[]};
const rates=[['🇺🇸🇪🇺','USD → EUR','0.9241','+0.18%'],['🇬🇧🇯🇵','GBP → JPY','191.56','-0.45%'],['🇪🇺🇺🇸','EUR → USD','1.0821','+0.12%']];
const screen=document.querySelector('#screen'),nav=document.querySelector('#nav');
function renderNav(){const tabs=[['home','⌂','Home'],['exchange','↕','Exchange'],['profile','◉','Profile'],['settings','⚙','Settings']];nav.innerHTML=tabs.map(x=>`<button class="${state.tab===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function go(tab){state.tab=tab;render()}
function render(){renderNav();if(state.tab==='home')home();if(state.tab==='exchange')exchange();if(state.tab==='profile')profile();if(state.tab==='settings')settings();if(state.tab==='admin')admin()}
function top(title,sub){return `<div class="top"><div class="brand"><span class="logo">↻</span>MerLuy</div><button class="icon" onclick="notifications()">♧${state.notes.length?`<span class="badge">${state.notes.length}</span>`:''}</button></div><h1>${title}</h1><div class="sub">${sub}</div>`}
function home(){screen.innerHTML=top('Welcome to MerLuy','Real-time global transactions')+`<div class="label">Live Markets</div>${rates.map(r=>`<div class="card market"><div><div class="pair">${r[0]} ${r[1]}</div><div class="rate">${r[2]}</div></div><span class="change">${r[3]}</span></div>`).join('')}<div class="label">Quick Convert</div><div class="card"><div class="row"><div><small class="sub">You send</small><div class="rate">1,000</div></div><span class="pill">🇺🇸 USD</span></div><hr style="border-color:#ffffff18"><div class="row"><div><small class="sub">You receive</small><div class="rate" style="color:var(--cyan)">924.10</div></div><span class="pill">🇪🇺 EUR</span></div></div>`}
function exchange(){screen.innerHTML=`<button class="back" onclick="go('home')">← Back</button><h1>Exchange</h1><div class="sub">Convert between world currencies</div><div class="label">Amount</div><input id="amount" class="input" value="100" inputmode="decimal"><div class="card"><div class="sub">From</div><select id="from"><option>🇺🇸 USD</option><option>🇪🇺 EUR</option><option>🇰🇭 KHR</option><option>🇬🇧 GBP</option></select><div class="center" style="font-size:25px">⇅</div><div class="sub">To</div><select id="to"><option>🇪🇺 EUR</option><option>🇰🇭 KHR</option><option>🇺🇸 USD</option><option>🇯🇵 JPY</option></select></div><button class="primary" onclick="convert()">Convert Amount</button><div id="result" class="card"><div class="sub">Result</div><div class="rate">€85.00</div><small class="sub">1 USD = 0.85 EUR · Updated 1m ago</small></div>`}
function convert(){document.querySelector('#result').innerHTML='<div class="sub">Result</div><div class="rate">៛410,000.00</div><small class="sub">1 USD = 4,100 KHR · Updated now</small>'}
function profile(){if(!state.logged){screen.innerHTML=top('Profile','Login or create your MerLuy account')+`<div class="card center"><div class="avatar">●</div><h2>Create your profile</h2><p class="sub">Save your name, verification, profile image, and Pro plan locally.</p><button class="primary" onclick="login()">Login / Register</button></div>`;return}screen.innerHTML=top('Profile','Your account, verification, and plan')+`<div class="card center"><div class="avatar">${state.name[0]||'●'}</div><h2>${state.name}</h2><div class="sub">${state.email}</div></div><div class="card row"><span>✓ ${state.pro?'Pro Beta':'Free Plan'}</span><span class="plan">${state.pro?'ACTIVE':'FREE'}</span></div><div class="card row"><span>✓ Account verified</span><button class="pill" onclick="alert('Profile image picker is available in the native iOS app.')">Change photo</button></div><button class="primary" onclick="state.logged=false;render()">Log Out</button>`}
function login(){state.logged=true;state.name=prompt('Your name','MerLuy User')||'MerLuy User';state.email=prompt('Email','user@example.com')||'user@example.com';render()}
function settings(){screen.innerHTML=top('Settings','Manage your preferences and profiles')+`<div class="label">Preferences</div><div class="card"><div class="row" style="padding:12px 0">🌙 Dark Theme <span class="pill">ON</span></div><div class="row" style="padding:12px 0">🌐 Language <span class="pill">English / Khmer</span></div></div><div class="label">About</div><div class="card"><div class="row" style="padding:12px 0">⭐ Rate MerLuy <span>›</span></div><div class="row" style="padding:12px 0">ⓘ Version <span class="sub">v26.4.2</span></div></div>`}
function notifications(){screen.innerHTML=`<button class="back" onclick="go('home')">← Back</button><h1>Notifications</h1><div class="sub">Updates from MerLuy</div>${state.notes.length?state.notes.map(n=>`<div class="card"><b>🔔 ${n.title}</b><p class="sub">${n.message}</p></div>`).join(''):'<div class="card center"><h2>🔕</h2><p class="sub">No notifications yet</p></div>'}`}
render();
</script></body></html>
