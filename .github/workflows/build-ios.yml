name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project MerLuy.xcodeproj \
            -scheme MerLuy \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/MerLuy.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/MerLuy.xcarchive/Products/Applications/MerLuy.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r MerLuy-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerLuy-unsigned-ipa
          path: ${{ runner.temp }}/MerLuy-unsigned.ipa
          if-no-files-found: error
